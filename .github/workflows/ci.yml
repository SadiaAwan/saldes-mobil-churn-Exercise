name: CI

on:
  workflow_dispatch:
    inputs:
      datafil:
        description: "Sökväg till datafilen som ska kontrolleras"
        required: true
        default: "data/kundbas.csv"
        type: string

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  push:
    paths:
      - "src/**"
      - "data/**"
      - "kontroller/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "kontroller/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datakontroll:
    name: Kontrollera kunddata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Installera databeroenden
        run: python -m pip install -e ".[data]"

      - name: Validera vald datafil
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }}
        run: python kontroller/schema.py "$DATAFIL"

  tester:
    name: Tester Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - run: pytest

  traning:
    name: Träning Python 3.11
    needs: [tester, datakontroll]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python

      - run: python -m churn.model

      - name: Ladda upp modell och mätvärden
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    name: Utvärdera modell
    needs: traning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python

      - name: Ladda ner modell och mätvärden
        uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Visa mätvärden i Summary
        run: |
          {
            echo '## Modellens mätvärden'
            echo '```json'
            cat outputs/matvarden.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kontrollera modellens kvalitet
        run: python -m churn.evaluate

  ringlista:
    name: Skapa ringlista
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python

      - name: Ladda ner godkänd modell
        uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skapa ringlistan
        run: python -m churn.score

      - name: Ladda upp ringlistan
        uses: actions/upload-artifact@v7
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error