name: CI

on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"



jobs:
  tester:
    name: Tester Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - run: pytest

  traning:
    name: Träning Python 3.11
    needs: tester
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - run: python -m churn.model

      - name: Ladda upp modell och mätvärden
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    name: Utvärdera modell
    needs: traning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: pip install -e ".[dev]"

      - name: Ladda ner modell och mätvärden
        uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Visa mätvärden i Summary
        run: |
          {
            echo '## Modellens mätvärden'
            echo '```json'
            cat outputs/matvarden.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kontrollera modellens kvalitet
        run: python -m churn.evaluate