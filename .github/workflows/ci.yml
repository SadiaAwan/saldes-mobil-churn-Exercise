name: CI

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tester:
    name: Tester Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - run: pytest

  traning:
    name: Träning Python 3.11
    needs: tester
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python

      - run: python -m churn.model

      - name: Ladda upp modell och mätvärden
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    name: Utvärdera modell
    needs: traning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python

      - name: Ladda ner modell och mätvärden
        uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Visa mätvärden i Summary
        run: |
          {
            echo '## Modellens mätvärden'
            echo '```json'
            cat outputs/matvarden.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kontrollera modellens kvalitet
        env:
          MIN_ROC_AUC: "0.90"
        run: python -m churn.evaluate
# Ny push testar att den tidigare CI-korningen avbryts.
# Concurrency-test: forsta snabba pushen.
# Concurrency-test: andra snabba pushen.

  ringlista:
    name: Skapa ringlista
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installera Python och paket
        uses: ./.github/actions/setup-python

      - name: Ladda ner godkänd modell
        uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skapa ringlistan
        run: python -m churn.score

      - name: Ladda upp ringlistan
        uses: actions/upload-artifact@v7
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error